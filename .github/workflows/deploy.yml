# Builds the site and publishes it to GitHub Pages.
# Runs when main changes, every Monday (to re-check linked-source URLs and
# refresh "last verified" dates), and on demand from the Actions tab.
# Broken links are listed in the run summary but never stop the deploy.
name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1' # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tool.json files
        run: npm run validate
      - name: Build site and check linked-source URLs
        run: npm run build:check-links
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
